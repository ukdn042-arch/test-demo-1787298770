<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Demo 1787298770</title>
  <style>
    :root { --bg:#0b1020; --card:#141c33; --accent:#6d8bff; --text:#e8ecf7; --muted:#9aa6c4; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 70% -10%, #1b2a4d 0%, var(--bg) 55%);

      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .hero {

      border-radius: 24px;
      padding: 56px 40px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(109,139,255,0.12);
      border: 1px solid rgba(109,139,255,0.3);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 24px;
    }
    h1 { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 16px; }
    .tagline { font-size: 20px; font-weight: 500; color: var(--accent); margin-bottom: 20px; }
    .about { font-size: 16px; line-height: 1.7; color: var(--muted); }
    footer { margin-top: 40px; font-size: 13px; color: var(--muted); opacity: 0.7; }
  </style>
</head>

  <main class="hero">
    <span class="badge">Launching soon</span>

</body>
</html>
